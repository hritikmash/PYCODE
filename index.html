    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket connection failure messages in Cloud Run iframe environment
      (function() {
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        console.error = function(...args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a?.message || '')).join(' ');
          if (
            msg.includes('WebSocket') ||
            msg.includes('connection to') ||
            msg.includes('vite') ||
            msg.includes('ws://') ||
            msg.includes('wss://')
          ) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a?.message || '')).join(' ');
          if (
            msg.includes('WebSocket') ||
            msg.includes('connection to') ||
            msg.includes('vite') ||
            msg.includes('ws://') ||
            msg.includes('wss://')
          ) {
            return;
          }
          originalConsoleWarn.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          const msg = event?.message || '';
          if (msg.includes('WebSocket') || event?.filename?.includes('@vite')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
